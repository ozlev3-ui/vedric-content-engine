<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>OZ Body</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6}iframe{border:0;width:100%;height:100%;display:block}.hold-hint{font-size:12px;color:#6b7280;margin-top:4px}.water-custom{margin-top:12px}.water-stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}.water-stepper button{height:48px;border:1px solid #d1d5db;background:#fff;border-radius:14px;font-size:25px;font-weight:800}.water-stepper input{height:48px;text-align:center;font-size:20px;font-weight:800;margin:0!important}.water-add{margin-top:8px;width:100%;border:0;border-radius:13px;padding:12px;background:#111827;color:#fff;font-weight:800}.longpress-ready{outline:2px solid #111827!important;background:#eef2ff!important;transform:scale(1.01)}.longpress-dragging{opacity:.6!important;box-shadow:0 8px 24px rgba(0,0,0,.16);position:relative;z-index:20}.longpress-target{outline:2px dashed #111827!important}</style></head><body><iframe id="app" src="app-v5.html?v=6"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;patchAll(w,d);new w.MutationObserver(()=>patchAll(w,d)).observe(d.body,{childList:true,subtree:true});});
function patchAll(w,d){patchWater(w,d);patchTasks(w,d);const hint=d.querySelector('#timeline')?.previousElementSibling?.querySelector('small');if(hint)hint.textContent='לחיצה ארוכה של שנייה על שורה ואז גרירה. גלילה רגילה נשארת חופשית.';}
function patchWater(w,d){const text=d.getElementById('waterText');if(!text)return;const card=text.closest('.card');if(!card||card.dataset.preciseWater)return;card.dataset.preciseWater='1';const old=card.querySelector('.waterBtns');const select=d.getElementById('cupSize');if(old)old.remove();if(select)select.remove();const wrap=d.createElement('div');wrap.className='water-custom';wrap.innerHTML='<div class="water-stepper"><button type="button" id="waterMinus">−</button><input id="waterAmount" type="number" min="50" max="3000" step="50" value="300" inputmode="numeric"><button type="button" id="waterPlus">+</button></div><button type="button" class="water-add" id="waterAddExact">הוספת הכמות ששתיתי</button><p class="hold-hint">אפשר לבחור כל כמות, למשל 300 מ״ל או בקבוק של 1,000 מ״ל.</p>';card.appendChild(wrap);const inp=d.getElementById('waterAmount');d.getElementById('waterMinus').onclick=()=>inp.value=Math.max(50,(Number(inp.value)||300)-50);d.getElementById('waterPlus').onclick=()=>inp.value=Math.min(3000,(Number(inp.value)||300)+50);d.getElementById('waterAddExact').onclick=()=>{const n=Math.max(1,Number(inp.value)||0);if(n&&typeof w.addWater==='function')w.addWater(n);};}
let active=null,holdTimer=null,startX=0,startY=0,armed=false;
function patchTasks(w,d){d.querySelectorAll('.task').forEach(task=>{if(task.dataset.longpress)return;const clone=task.cloneNode(true);task.replaceWith(clone);clone.dataset.longpress='1';clone.style.touchAction='pan-y';clone.draggable=false;const status=clone.querySelector('.status');if(status){status.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});status.addEventListener('pointerdown',e=>e.stopPropagation());}
clone.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY;active=clone;armed=false;holdTimer=setTimeout(()=>{armed=true;clone.classList.add('longpress-ready');if(navigator.vibrate)navigator.vibrate(40);},1000);},{passive:true});
clone.addEventListener('touchmove',e=>{if(!active)return;const t=e.touches[0],dx=Math.abs(t.clientX-startX),dy=Math.abs(t.clientY-startY);if(!armed){if(dx>10||dy>10){clearTimeout(holdTimer);active=null;}return;}e.preventDefault();active.classList.remove('longpress-ready');active.classList.add('longpress-dragging');d.querySelectorAll('.longpress-target').forEach(x=>x.classList.remove('longpress-target'));const el=d.elementFromPoint(t.clientX,t.clientY)?.closest('.task');if(el&&el!==active){el.classList.add('longpress-target');const rect=el.getBoundingClientRect();el.parentNode.insertBefore(active,t.clientY<rect.top+rect.height/2?el:el.nextSibling);}}, {passive:false});
clone.addEventListener('touchend',()=>finishDrag(w,d));clone.addEventListener('touchcancel',()=>finishDrag(w,d));});}
function finishDrag(w,d){clearTimeout(holdTimer);if(active){active.classList.remove('longpress-ready','longpress-dragging');d.querySelectorAll('.longpress-target').forEach(x=>x.classList.remove('longpress-target'));if(armed){const tasks=[...d.querySelectorAll('#timeline .task')];const labels=tasks.map(x=>x.querySelector('div:nth-child(3)')?.textContent?.trim()).filter(Boolean);try{if(w.db){w.db.order=labels;if(typeof w.save==='function')w.save();else w.localStorage.setItem('ozbody-v9',JSON.stringify(w.db));}}catch(e){}}}active=null;armed=false;}
</script></body></html>
