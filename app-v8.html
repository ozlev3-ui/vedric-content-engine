<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OZ Body</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6}iframe{border:0;width:100%;height:100%;display:block}.meal-detail{margin-top:10px;padding:12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px}.meal-detail h4{margin:0 0 8px}.food-line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid #e5e7eb}.food-line:last-child{border-bottom:0}.gram{font-weight:900;white-space:nowrap}.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.macro div{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:8px;text-align:center}.swap{margin-top:10px;padding:10px;background:#fff7ed;border-radius:12px;line-height:1.5}.how{margin-top:10px;line-height:1.55}.meal-toggle{width:100%;text-align:right;border:0;background:transparent;padding:0;cursor:pointer}.meal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.chev{font-size:20px;transition:.2s}.open .chev{transform:rotate(180deg)}</style></head><body><iframe id="app" src="app-v7.html?v=8"></iframe><script>
const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;upgradeMeals(w,d);new w.MutationObserver(()=>upgradeMeals(w,d)).observe(d.body,{childList:true,subtree:true});});

function fallback(day){return exactPlans[0].map(x=>({...x}));}
function upgradeMeals(w,d){const plan=d.getElementById('mealPlan');if(!plan||plan.dataset.exact)return;plan.dataset.exact='1';const day=new Date().getDay();const meals=exactPlans[day]||fallback(day);plan.innerHTML=meals.map((m,i)=>`<div class="meal-card" style="padding:13px 0;border-bottom:1px solid #eee"><button class="meal-toggle" data-i="${i}"><div class="meal-head"><div><b>${m.title}</b><div class="muted">${m.time} · לחץ לפירוט מדויק</div></div><span class="chev">⌄</span></div></button><div class="meal-detail" id="detail-${i}" hidden><h4>מה לשים בצלחת</h4>${m.items.map(x=>`<div class="food-line"><span>${x[0]}</span><span class="gram">${x[1]}</span></div>`).join('')}<div class="macro"><div><b>${m.mac[0]}</b><br><small>אנרגיה</small></div><div><b>${m.mac[1]}</b><br><small>חלבון</small></div><div><b>${m.mac[2]}</b><br><small>פחמימה</small></div></div><div class="how"><b>איך לבצע:</b> ${m.how}</div><div class="swap"><b>החלפות:</b> ${m.swap}</div><button class="primary markMeal" data-i="${i}" style="margin-top:10px">סיימתי את הארוחה</button></div></div>`).join('');plan.querySelectorAll('.meal-toggle').forEach(btn=>btn.onclick=()=>{const box=d.getElementById('detail-'+btn.dataset.i);const card=btn.closest('.meal-card');box.hidden=!box.hidden;card.classList.toggle('open',!box.hidden)});plan.querySelectorAll('.markMeal').forEach(btn=>btn.onclick=()=>{btn.textContent=btn.textContent.includes('✓')?'סיימתי את הארוחה':'✓ הארוחה סומנה';btn.style.background=btn.textContent.includes('✓')?'#166534':'#111827'});const note=d.createElement('div');note.className='notice';note.style.marginTop='12px';note.innerHTML='<b>איך קוראים את הכמויות?</b><br>כשכתוב “לאחר בישול” שוקלים את המזון כשהוא מוכן לאכילה. בשאר המקרים שוקלים את החלק הנאכל. זהו תפריט התחלה שדורש התאמה לפי ירידה במשקל, תחושת שובע, אימונים ומצב הקרוהן.';plan.parentElement.appendChild(note);}
