<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>OZ Body</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;padding:16px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.top h1{margin:0}.card,.hero{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:12px}.hero{background:#111827;color:#fff}.hero b{color:#d9f99d}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{height:10px;background:#374151;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#d9f99d}.next{font-size:20px;margin:12px 0 4px}.muted{color:#6b7280}.timeline{position:relative}.slot{display:grid;grid-template-columns:54px 28px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.slot:last-child{border:0}.slot .dot{width:18px;height:18px;border:2px solid #9ca3af;border-radius:50%;margin-top:2px}.slot.done .dot{background:#111827;border-color:#111827}.slot.now .dot{background:#d9f99d;border-color:#111827}.slot button{border:0;background:transparent;text-align:right;padding:0;font:inherit}.pill{font-size:12px;background:#eef2ff;padding:5px 8px;border-radius:99px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}label{font-size:13px;font-weight:700}input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:11px;padding:10px;margin:5px 0 10px;background:#fff}.primary,.secondary{border:0;border-radius:13px;padding:12px;width:100%;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#eef2ff;color:#111827}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd;padding:7px}.tab{border:0;background:transparent;padding:7px;color:#6b7280}.tab.active{color:#111827;font-weight:800}.tab span{display:block;font-size:20px}.screen{display:none}.screen.active{display:block}.foodItem,.historyItem{padding:11px 0;border-bottom:1px solid #eee}.foodItem:last-child,.historyItem:last-child{border:0}.exercise{padding:10px 0;border-bottom:1px solid #eee}.exercise:last-child{border:0}.week{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.chip{border:1px solid #ddd;background:#fff;border-radius:12px;padding:8px 11px;white-space:nowrap}.chip.active{background:#111827;color:#fff}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app"><header class="top"><div><small>OZ BODY</small><h1 id="pageTitle">היום שלי</h1></div><b>אישי</b></header><main><section id="today" class="screen active"><div class="hero"><div class="row"><div><p id="date"></p><h2 id="todayWorkout"></h2></div><span class="pill" id="dayPercent">0%</span></div><div class="progress"><i id="bar" style="width:0%"></i></div><div class="next" id="nextTask"></div><small id="nextTime"></small></div><div class="card"><div class="row"><h3>סדר היום שלך</h3><span class="pill">07:00–00:00</span></div><p class="muted">הלו״ז בנוי כבלוקים גמישים. מסמנים התקדמות, גם כשהשעה זזה מעט.</p><div id="timeline" class="timeline"></div></div><div class="card"><h3>מדדי היום</h3><div class="grid"><label>משקל<input id="weight" type="number" step="0.1"></label><label>היקף בטן<input id="waist" type="number" step="0.1"></label><label>מים בליטרים<input id="water" type="number" step="0.25"></label><label>חלבון בגרמים<input id="protein" type="number"></label><label>שעות שינה<input id="sleep" type="number" step="0.5"></label><label>אנרגיה 1–10<input id="energy" type="number" min="1" max="10"></label><label>מצב קרוהן 1–10<input id="crohn" type="number" min="1" max="10"></label></div><label>הערות<textarea id="notes" rows="3"></textarea></label><button class="primary" onclick="saveDay()">שמירת היום</button><p id="saved"></p></div></section><section id="workouts" class="screen"><div class="week" id="week"></div><div class="card"><small>האימון שנבחר</small><h2 id="detailTitle"></h2><p class="muted" id="detailMeta"></p><div id="blocks"></div></div></section><section id="food" class="screen"><div class="card"><h2>יומן אכילה ושתייה</h2><p class="muted">מוסיפים כאן גם פרי, קפה עם חלב, נשנוש, ארוחה בחוץ או אירוע מיוחד.</p><div class="grid"><label>שעה<input id="foodTime" type="time"></label><label>מה אכלת או שתית<input id="foodName" placeholder="לדוגמה: קפה עם חלב"></label><label>סוג<select id="foodType"><option>ארוחה</option><option>פרי</option><option>קפה/שתייה</option><option>נשנוש</option><option>אחרי אימון</option><option>אירוע מיוחד</option></select></label><label>איפה<select id="foodPlace"><option>בבית</option><option>בחוץ</option><option>בעבודה</option><option>אצל משפחה/חברים</option><option>מסעדה/אירוע</option></select></label></div><label>כמות או פירוט<input id="foodAmount" placeholder="לדוגמה: תפוח אחד / כוס גדולה"></label><label>הערה<textarea id="foodNote" rows="2" placeholder="רעב, תחושה, אירוע מיוחד או כל פרט חשוב"></textarea></label><button class="primary" onclick="addFood()">הוספה ליומן</button></div><div class="card"><div class="row"><h3>מה נכנס היום</h3><button class="secondary" style="width:auto;padding:8px 12px" onclick="clearFoods()">ניקוי היום</button></div><div id="foodList"></div></div></section><section id="progress" class="screen"><div class="card"><h2>התקדמות</h2><p><b id="days">0</b> ימים שמורים</p><div id="history"></div></div></section></main><nav class="tabs"><button class="tab active" onclick="show('today','היום שלי',this)"><span>🏠</span>היום</button><button class="tab" onclick="show('workouts','אימונים',this)"><span>💪</span>אימונים</button><button class="tab" onclick="show('food','אכילה',this)"><span>🍽️</span>אכילה</button><button class="tab" onclick="show('progress','התקדמות',this)"><span>📈</span>מעקב</button></nav></div><script>const KEY='ozbody-v2',todayKey=()=>new Date().toISOString().slice(0,10);const DB=JSON.parse(localStorage.getItem(KEY)||'{}');const SCHEDULE=[['07:00','קימה','מתחילים את היום'],['07:00','שירותים והתארגנות רגועה','כ־30 דקות'],['07:30','מקלחת והתארגנות','עד 08:00'],['08:00','הליכת בוקר','20–30 דקות'],['08:30','מים, קפה ותכנון היום','כניסה רגועה ליום'],['09:00','עבודה ממוקדת','המשימה החשובה ביותר'],['10:00','ארוחה ראשונה','ארוחה מסודרת עם חלבון'],['10:30','עבודה / פגישות','בלוק עבודה מרכזי'],['14:00','אימון היום','HIIT, כוח או התאוששות'],['15:00','ארוחה לאחר האימון','חלבון והתאוששות'],['15:30','עבודה / פגישות','בלוק אחר הצהריים'],['18:30','ארוחת ערב','ארוחה מסודרת'],['19:00','זמן אישי / זוגיות / למידה','ערב גמיש'],['22:30','סגירת יום','הכנה למחר והרגעה'],['00:00','שינה','יעד קבוע']];const WORKOUTS={0:['קליסטניקס כוח A','35–45 דקות',['חימום 5 דקות','סקוואט לכיסא 3×10–12','שכיבות סמיכה בשיפוע 3×8–12','חתירה בטבעות 3×8–10','גשר ישבן 3×12–15','תלייה אקטיבית 4×15–25 שניות','פלאנק 3×25–40 שניות']],1:['HIIT קצר','18–22 דקות',['חימום 4–5 דקות','6 סבבים: 20 שניות עבודה מהירה','100 שניות התאוששות בהליכה','סיום: 4 דקות הליכה ונשימות']],2:['הליכה והתאוששות','30–45 דקות',['הליכה בקצב נוח','מוביליות קרסול ואגן','3 דקות נשימות']],3:['קליסטניקס כוח B','35–45 דקות',['מכרע לאחור עם תמיכה 3×8','שכיבות סמיכה בשיפוע 3×8–12','חתירה באחיזה צרה 3×8–12','Hip Hinge 3×12','משיכות שכמות בתלייה 4×5–8','Dead Bug 3×8 לכל צד']],4:['HIIT קצר','18–22 דקות',['חימום 5 דקות','7 סבבים: 20 שניות עבודה','100 שניות התאוששות','סיום 5 דקות']],5:['קליסטניקס כוח C','35–45 דקות',['סקוואט לכיסא עם עצירה 3×10','שכיבות סמיכה 4 סטים','חתירה בטבעות 4×8–10','עליית מדרגה 3×10 לכל רגל','תלייה 60–90 שניות מצטבר','פלאנק צד 3×20–30 שניות']],6:['מנוחה','יום רגוע',['הליכה קלה לפי ההרגשה','מתיחות עדינות','הכנה לשבוע']]} ;function state(){DB[todayKey()]??={schedule:{},foods:[],metrics:{}};return DB[todayKey()]}function save(){localStorage.setItem(KEY,JSON.stringify(DB))}function show(id,title,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');pageTitle.textContent=title;if(id==='progress')renderHistory()}function mins(t){let[a,b]=t.split(':').map(Number);return a*60+b}function renderTimeline(){let s=state(),now=new Date(),m=now.getHours()*60+now.getMinutes(),done=0;timeline.innerHTML='';let nextIndex=SCHEDULE.findIndex((x,i)=>!s.schedule[i]&&mins(x[0])>=m-20);if(nextIndex<0)nextIndex=SCHEDULE.findIndex((x,i)=>!s.schedule[i]);SCHEDULE.forEach((x,i)=>{if(s.schedule[i])done++;let d=document.createElement('div');d.className='slot '+(s.schedule[i]?'done ':'')+(i===nextIndex?'now':'');d.innerHTML=`<b>${x[0]}</b><i class="dot"></i><button><b>${x[1]}</b><small class="muted" style="display:block">${x[2]}</small></button>`;d.querySelector('button').onclick=()=>{s.schedule[i]=!s.schedule[i];save();renderTimeline()};timeline.appendChild(d)});let p=Math.round(done/SCHEDULE.length*100);dayPercent.textContent=p+'%';bar.style.width=p+'%';let n=SCHEDULE[nextIndex];nextTask.textContent=n?'המשימה הבאה: '+n[1]:'היום הושלם 🎉';nextTime.textContent=n?'מתוכנן לשעה '+n[0]:''}function workout(day=new Date().getDay()){let w=WORKOUTS[day];todayWorkout.textContent=w[0];detailTitle.textContent=w[0];detailMeta.textContent=w[1];blocks.innerHTML=w[2].map(x=>`<div class="exercise">✓ ${x}</div>`).join('')}function renderWeek(){week.innerHTML='';['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'].forEach((x,i)=>{let b=document.createElement('button');b.className='chip'+(i===new Date().getDay()?' active':'');b.textContent=x;b.onclick=()=>{document.querySelectorAll('.chip').forEach(y=>y.classList.remove('active'));b.classList.add('active');workout(i)};week.appendChild(b)})}function addFood(){if(!foodName.value.trim())return alert('רשום מה אכלת או שתית');let s=state();s.foods.push({time:foodTime.value||new Date().toTimeString().slice(0,5),name:foodName.value.trim(),type:foodType.value,place:foodPlace.value,amount:foodAmount.value,note:foodNote.value});save();foodName.value=foodAmount.value=foodNote.value='';renderFoods()}function renderFoods(){let f=state().foods||[];foodList.innerHTML=f.length?f.map((x,i)=>`<div class="foodItem"><div class="row"><b>${x.time} · ${x.name}</b><button onclick="removeFood(${i})">🗑️</button></div><small>${x.type} · ${x.place}${x.amount?' · '+x.amount:''}</small>${x.note?`<p class="muted">${x.note}</p>`:''}</div>`).join(''):'<p class="muted">עדיין לא נוספו פריטים היום.</p>'}function removeFood(i){state().foods.splice(i,1);save();renderFoods()}function clearFoods(){if(confirm('למחוק את יומן האכילה של היום?')){state().foods=[];save();renderFoods()}}function saveDay(){let s=state();['weight','waist','water','protein','sleep','energy','crohn','notes'].forEach(k=>s.metrics[k]=document.getElementById(k).value);save();saved.textContent='היום נשמר ✓';renderHistory()}function loadMetrics(){let m=state().metrics||{};Object.keys(m).forEach(k=>{let e=document.getElementById(k);if(e)e.value=m[k]})}function renderHistory(){let keys=Object.keys(DB).sort().reverse();days.textContent=keys.length;history.innerHTML=keys.map(k=>{let m=DB[k].metrics||{};return `<div class="historyItem"><b>${k}</b><small class="muted" style="display:block">משקל ${m.weight||'—'} · מים ${m.water||'—'} ל׳ · חלבון ${m.protein||'—'} ג׳ · פריטי אכילה ${(DB[k].foods||[]).length}</small></div>`}).join('')||'<p class="muted">ההיסטוריה תופיע אחרי שמירת יום.</p>'}date.textContent=new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});foodTime.value=new Date().toTimeString().slice(0,5);renderTimeline();workout();renderWeek();renderFoods();loadMetrics();renderHistory();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
