<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12211b"><title>MYBH Flow</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f6f4;color:#142019;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:24px}.spin{width:42px;height:42px;border:4px solid #dfe7e2;border-top-color:#2e7458;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{border:0;border-radius:14px;padding:12px 18px;background:#173f31;color:white;font-weight:700}</style></head><body><div class="box"><div class="spin"></div><h2>MYBH Flow נטענת...</h2><p id="msg">מכינים את הגרסה לבדיקה.</p><button id="retry" hidden onclick="location.reload()">נסה שוב</button></div><script>fetch('https://raw.githubusercontent.com/ozlev3-ui/vedric-content-engine/oz-body-app/oz-body/mybh-flow.html?v=2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(html=>{document.open();document.write(html);document.close()}).catch(e=>{document.getElementById('msg').textContent='הטעינה נכשלה. בדוק חיבור ונסה שוב.';document.getElementById('retry').hidden=false;document.querySelector('.spin').style.display='none';console.error(e)})</script></body></html>
