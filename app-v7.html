<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OZ Body</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="app-v5.html?v=7"></iframe><script>
const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;patchAll(w,d);new w.MutationObserver(()=>patchAll(w,d)).observe(d.body,{childList:true,subtree:true});});
function patchAll(w,d){patchWater(w,d);patchTasks(w,d);patchFood(w,d);}
function patchWater(w,d){const text=d.getElementById('waterText');if(!text)return;const card=text.closest('.card');if(!card||card.dataset.preciseWater)return;card.dataset.preciseWater='1';card.querySelector('.waterBtns')?.remove();d.getElementById('cupSize')?.remove();const wrap=d.createElement('div');wrap.innerHTML='<div style="display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin-top:12px"><button id="wm" style="height:48px;border:1px solid #d1d5db;background:#fff;border-radius:14px;font-size:25px;font-weight:800">−</button><input id="wa" type="number" min="50" max="3000" step="50" value="300" inputmode="numeric" style="height:48px;text-align:center;font-size:20px;font-weight:800;margin:0"><button id="wp" style="height:48px;border:1px solid #d1d5db;background:#fff;border-radius:14px;font-size:25px;font-weight:800">+</button></div><button id="wadd" style="margin-top:8px;width:100%;border:0;border-radius:13px;padding:12px;background:#111827;color:#fff;font-weight:800">הוספת הכמות ששתיתי</button>';card.appendChild(wrap);const i=d.getElementById('wa');d.getElementById('wm').onclick=()=>i.value=Math.max(50,(+i.value||300)-50);d.getElementById('wp').onclick=()=>i.value=Math.min(3000,(+i.value||300)+50);d.getElementById('wadd').onclick=()=>w.addWater?.(Math.max(1,+i.value||0));}
let active=null,timer=null,sx=0,sy=0,armed=false;function patchTasks(w,d){d.querySelectorAll('.task').forEach(task=>{if(task.dataset.lp)return;const c=task.cloneNode(true);task.replaceWith(c);c.dataset.lp='1';c.style.touchAction='pan-y';c.draggable=false;c.querySelector('.status')?.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});c.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;active=c;armed=false;timer=setTimeout(()=>{armed=true;c.style.outline='2px solid #111827';navigator.vibrate?.(40)},1000)},{passive:true});c.addEventListener('touchmove',e=>{if(!active)return;const t=e.touches[0];if(!armed){if(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10){clearTimeout(timer);active=null}return}e.preventDefault();c.style.opacity='.6';const el=d.elementFromPoint(t.clientX,t.clientY)?.closest('.task');if(el&&el!==c){const r=el.getBoundingClientRect();el.parentNode.insertBefore(c,t.clientY<r.top+r.height/2?el:el.nextSibling)}},{passive:false});c.addEventListener('touchend',()=>finish(w,d));c.addEventListener('touchcancel',()=>finish(w,d));})}
function finish(w,d){clearTimeout(timer);if(active){active.style.outline='';active.style.opacity='';if(armed){const labels=[...d.querySelectorAll('#timeline .task')].map(x=>x.querySelector('div:nth-child(3)')?.textContent?.trim()).filter(Boolean);if(w.db){w.db.order=labels;w.save?.()}}}active=null;armed=false}
function patchFood(w,d){const sec=d.getElementById('food');if(!sec||sec.dataset.plan)return;sec.dataset.plan='1';sec.innerHTML='<div class="card"><div class="row"><div><h2 style="margin-bottom:4px">הארוחות שלי להיום</h2><p class="muted" id="mealDay"></p></div><span class="pill">תפריט יומי</span></div><div id="mealPlan"></div></div><div class="card"><h2>הוספת מה שאכלתי בפועל</h2><p class="muted">אפשר להוסיף ארוחה, ארוחת ביניים, קפה, נשנוש או צילום של מה שאכלת.</p><label>סוג ארוחה<select id="logType"><option>ארוחה ראשונה</option><option>ארוחת צהריים</option><option>ארוחת ערב</option><option>ארוחת ביניים</option><option>אחרי אימון</option><option>קפה / שתייה</option><option>נשנוש</option><option>אחר</option></select></label><label>מה אכלת<input id="logName" placeholder="למשל: 2 ביצים, סלט ופרוסת לחם"></label><div class="grid"><label>שעה<input id="logTime" type="time"></label><label>כמות / פירוט<input id="logAmount" placeholder="למשל: קערה, 150 גרם"></label></div><label>תמונה<input id="logPhoto" type="file" accept="image/*" capture="environment"></label><label>הערה<textarea id="logNote" rows="2"></textarea></label><button class="primary" id="saveMealLog">שמירה ביומן</button></div><div class="card"><div class="row"><h3>מה אכלתי היום</h3><button class="tiny" id="clearMealLog">ניקוי</button></div><div id="mealLog"></div></div>';const plans={0:[['10:00','ארוחה ראשונה','2 ביצים + ירקות חתוכים + 1–2 פרוסות לחם מלא או כוסמין + טחינה'],['13:30','ארוחת ביניים','פרי אחד + חופן קטן אגוזים, או טונה עם ירקות'],['15:00','אחרי אימון','טונה / חזה עוף / ביצים + אורז או תפוח אדמה + ירקות מבושלים'],['18:30','ארוחת ערב','חביתה או טונה + סלט + טחינה / אבוקדו']],1:[['10:00','ארוחה ראשונה','חביתה מ-2–3 ביצים + ירקות + לחם מלא'],['13:30','ארוחת ביניים','בננה או תפוח + 10–15 שקדים'],['15:00','אחרי אימון','חזה עוף או טונה + אורז + ירקות'],['18:30','ארוחת ערב','סלט גדול עם ביצים או טונה וטחינה']],2:[['10:00','ארוחה ראשונה','2 ביצים + תפוח אדמה מבושל + ירקות'],['13:30','ארוחת ביניים','פרי או קרקר כוסמין עם טחינה'],['14:30','ארוחת צהריים','עוף רזה / דג / טונה + אורז + ירקות מבושלים'],['18:30','ארוחת ערב','מרק ירקות + ביצה או טונה']],3:[['10:00','ארוחה ראשונה','חביתה + סלט + 1–2 פרוסות לחם'],['13:30','ארוחת ביניים','פרי + אגוזים'],['15:00','אחרי אימון','עוף / טונה + תפוח אדמה + ירקות'],['18:30','ארוחת ערב','ביצים קשות + ירקות + טחינה']],4:[['10:00','ארוחה ראשונה','2–3 ביצים + ירקות + לחם כוסמין'],['13:30','ארוחת ביניים','פרי או טונה קטנה'],['15:00','אחרי אימון','חלבון רזה + אורז / תפוח אדמה + ירקות'],['18:30','ארוחת ערב','סלט עם טונה / ביצים ואבוקדו']],5:[['10:00','ארוחה ראשונה','חביתה + ירקות + לחם מלא'],['13:30','ארוחת ביניים','פרי + חופן אגוזים'],['14:30','ארוחת צהריים','עוף / דג + אורז + ירקות'],['19:00','ארוחת ערב','ארוחה גמישה ומסודרת: חלבון, פחמימה וירקות']],6:[['10:00','ארוחה ראשונה','ביצים + ירקות + לחם'],['13:30','ארוחת ביניים','פרי או טונה'],['14:30','ארוחת צהריים','עוף / דג / טונה + תפוח אדמה או אורז'],['18:30','ארוחת ערב','ארוחה קלה: חביתה / מרק / סלט עם חלבון']]};const day=new Date().getDay(),names=['יום ראשון','יום שני','יום שלישי','יום רביעי','יום חמישי','יום שישי','שבת'];d.getElementById('mealDay').textContent=names[day];d.getElementById('mealPlan').innerHTML=plans[day].map((m,i)=>'<div style="padding:13px 0;border-bottom:1px solid #eee"><div class="row"><div><b>'+m[1]+'</b><div class="muted">'+m[0]+'</div></div><button class="tiny mealDone" data-i="'+i+'">○</button></div><p style="margin:8px 0 0;line-height:1.5">'+m[2]+'</p></div>').join('');const key='ozbody-food-'+new Date().toISOString().slice(0,10);let logs=JSON.parse(localStorage.getItem(key)||'[]');const render=()=>{d.getElementById('mealLog').innerHTML=logs.length?logs.map((x,i)=>'<div style="padding:11px 0;border-bottom:1px solid #eee"><b>'+x.type+' · '+x.time+'</b><div>'+x.name+'</div><small class="muted">'+x.amount+(x.note?' · '+x.note:'')+'</small></div>').join(''):'<p class="muted">עדיין לא נוספו ארוחות בפועל.</p>'};render();d.getElementById('saveMealLog').onclick=()=>{const name=d.getElementById('logName').value.trim();if(!name)return alert('רשום מה אכלת');logs.push({type:d.getElementById('logType').value,name,time:d.getElementById('logTime').value||new Date().toTimeString().slice(0,5),amount:d.getElementById('logAmount').value,note:d.getElementById('logNote').value});localStorage.setItem(key,JSON.stringify(logs));d.getElementById('logName').value='';d.getElementById('logAmount').value='';d.getElementById('logNote').value='';render()};d.getElementById('clearMealLog').onclick=()=>{if(confirm('לנקות את יומן האכילה של היום?')){logs=[];localStorage.setItem(key,'[]');render()}};d.querySelectorAll('.mealDone').forEach(b=>b.onclick=()=>{b.textContent=b.textContent==='✓'?'○':'✓';b.style.background=b.textContent==='✓'?'#dcfce7':'#f3f4f6'})}
</script></body></html>
