<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OZ Body Nutrition V2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6;font-family:Arial,sans-serif}iframe{border:0;width:100%;height:100%;display:block}.meal-card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;margin:0 0 12px;overflow:hidden}.meal-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;cursor:pointer}.meal-head h3{margin:0 0 4px}.meal-body{display:none;padding:0 14px 14px;border-top:1px solid #eee}.meal-card.open .meal-body{display:block}.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.macro div{background:#f3f4f6;border-radius:10px;padding:8px;text-align:center;font-size:12px}.foodrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.foodrow:last-child{border:0}.tag{display:inline-block;background:#eef2ff;border-radius:99px;padding:5px 9px;font-size:12px;margin:3px}.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.action-grid button,.wide{border:0;border-radius:12px;padding:11px;font-weight:800}.done{background:#dcfce7}.swap{background:#eef2ff}.ask{background:#111827;color:#fff}.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.subtabs button{border:0;border-radius:12px;padding:10px 4px;background:#eef2ff;font-weight:700}.subtabs button.active{background:#111827;color:#fff}.pane{display:none}.pane.active{display:block}.uploadBox{border:2px dashed #cbd5e1;border-radius:16px;padding:18px;text-align:center;background:#f8fafc}.preview{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-top:10px}.chatbox{height:330px;overflow:auto;background:#f8fafc;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:85%;padding:10px 12px;border-radius:15px;line-height:1.45}.mine{align-self:flex-start;background:#d9f99d}.theirs{align-self:flex-end;background:#fff;border:1px solid #e5e7eb}.chatinput{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}.chatinput textarea{margin:0}.score{font-size:28px;font-weight:900}.warning{background:#fff7ed;border-radius:14px;padding:12px;margin-bottom:12px}.small{font-size:12px;color:#6b7280}.section-title{margin:0 0 10px}</style></head><body><iframe id="app" src="app-v7.html?v=9"></iframe><script>
const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;patch(w,d);new w.MutationObserver(()=>patch(w,d)).observe(d.body,{childList:true,subtree:true});});
function patch(w,d){const sec=d.getElementById('food');if(!sec||sec.dataset.nutriV2)return;sec.dataset.nutriV2='1';sec.innerHTML=`<div class="warning"><b>המאמן התזונתי שלך</b><br><span class="small">התוכנית מותאמת להעדפות שסיכמנו: ללא גבינות לבנות, גבינה צהובה אפשרית, שילוב ביצים וטונה, וגם מקורות חלבון מהצומח. הכמויות הן גרסת התחלה ויעודכנו לפי משקל, תגובת מערכת העיכול, אימונים והתקדמות.</span></div><div class="subtabs"><button class="active" data-pane="plan">התוכנית</button><button data-pane="photo">מה אכלתי</button><button data-pane="talk">דבר איתי</button><button data-pane="stats">סיכום</button></div><div id="plan" class="pane active"><div id="detailedPlan"></div></div><div id="photo" class="pane"><div class="card"><h2 class="section-title">צילום ארוחה</h2><div class="uploadBox"><label style="display:block;cursor:pointer">📷 צילום או העלאת תמונה<input id="mealPhoto" type="file" accept="image/*" capture="environment" style="display:none"></label><img id="mealPreview" class="preview" hidden><p class="small">לאחר חיבור מנוע AI, התמונה תנותח אוטומטית. בינתיים אפשר להעלות, לצפות ולרשום מה אכלת.</p></div><label>סוג ארוחה<select id="actualType"><option>ארוחת בוקר</option><option>ארוחת ביניים</option><option>ארוחת צהריים</option><option>אחרי אימון</option><option>ארוחת ערב</option><option>נשנוש</option><option>אחר</option></select></label><label>מה היה בצלחת<textarea id="actualText" rows="3" placeholder="למשל: 2 ביצים, קופסת טונה, סלט ו-2 פרוסות לחם"></textarea></label><div class="grid"><label>שעה<input id="actualTime" type="time"></label><label>כמות משוערת<input id="actualAmount" placeholder="למשל 450 גרם"></label></div><button class="primary" id="saveActual">שמירה ביומן</button></div><div class="card"><h3>יומן היום</h3><div id="actualLog"></div></div></div><div id="talk" class="pane"><div class="card"><h2 class="section-title">התזונאי האישי</h2><div id="nutriChat" class="chatbox"></div><div class="chatinput"><textarea id="nutriInput" rows="2" placeholder="למשל: אין לי טונה, במה להחליף?"></textarea><button class="primary" style="width:auto" id="nutriSend">שלח</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><label class="tiny" style="text-align:center">📷 תמונה<input id="chatPic" type="file" accept="image/*" hidden></label><label class="tiny" style="text-align:center">🎙️ קול<input id="chatVoice" type="file" accept="audio/*" capture hidden></label><label class="tiny" style="text-align:center">🎥 וידאו<input id="chatVid" type="file" accept="video/*" capture hidden></label></div></div></div><div id="stats" class="pane"><div class="card"><h2 class="section-title">הסיכום שלי להיום</h2><div class="grid"><div><span class="small">ארוחות שסומנו</span><div class="score" id="mealScore">0/4</div></div><div><span class="small">חלבון מתוכנן</span><div class="score">≈150g</div></div></div><p class="small">היעדים הם התחלתיים. בהמשך המערכת תחשב אותם לפי הנתונים והתגובה שלך בפועל.</p></div></div>`;setupTabs(d);renderMeals(w,d);setupActual(d);setupChat(d);}
function setupTabs(d){d.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{d.querySelectorAll('.subtabs button').forEach(x=>x.classList.remove('active'));d.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');d.getElementById(b.dataset.pane).classList.add('active')})}
const meals=[{time:'10:00',name:'ארוחת בוקר',goal:'שובע, חלבון גבוה ופתיחה יציבה של היום',kcal:520,p:48,c:39,f:18,foods:[['ביצים','2 ביצים שלמות, כ-120 גרם כולל הקליפה לפני הכנה'],['טונה','קופסה אחת מסוננת, 112–140 גרם לפי המוצר'],['לחם כוסמין/מלא','2 פרוסות, 70–80 גרם'],['סלט','עגבנייה 120 גרם + מלפפון 150 גרם + עלים לפי נוחות'],['טחינה','15 גרם טחינה גולמית + מים ולימון']],swaps:['במקום הטונה: 180 גרם טופו קשה','במקום הלחם: 200 גרם תפוח אדמה מבושל','גבינה צהובה: 2 פרוסות, 40–50 גרם, כאפשרות מדי פעם'],prep:'לסנן היטב את הטונה. להכין סלט קצוץ. להוסיף את הטחינה אחרי השקילה. משקל הירקות הוא לפני חיתוך.'},{time:'13:30',name:'ארוחת ביניים',goal:'לשמור על אנרגיה ולמנוע רעב גדול',kcal:260,p:22,c:30,f:7,foods:[['אפשרות א׳','בננה בינונית, 120 גרם אכיל + 25 גרם אבקת חלבון במים'],['אפשרות ב׳','150 גרם אדממה מבושלת ומקולפת'],['אפשרות ג׳','2 פרוסות לחם, 70 גרם + 80 גרם טונה מסוננת']],swaps:['במקום בננה: תפוח קלוף 150 גרם, אם מתאים לבטן','במקום אבקת חלבון: 180 גרם טופו קשה'],prep:'לבחור אפשרות אחת בלבד. במקרה של רגישות במערכת העיכול לבחור את האפשרות הפשוטה והקלה ביותר עבורך.'},{time:'15:00',name:'ארוחה אחרי אימון',goal:'התאוששות, מילוי מאגרי אנרגיה ושמירת מסת שריר',kcal:650,p:50,c:72,f:16,foods:[['חלבון','200 גרם חזה עוף/הודו לאחר בישול, או 200 גרם דג רזה'],['פחמימה','150 גרם אורז מבושל, או 270 גרם תפוח אדמה/בטטה מבושלים'],['ירקות','200–250 גרם ירקות מבושלים שמתאימים לך'],['שמן זית','5 גרם, כפית אחת']],swaps:['גרסה צמחית: 250 גרם טופו קשה + 100 גרם אדממה','גרסה ביצים וטונה: 2 ביצים + קופסת טונה מסוננת','במקום אורז: 180 גרם קינואה מבושלת, אם נסבלת'],prep:'המשקלים כאן הם לאחר בישול. בארוחה צמחית אפשר להפחית מעט שמן אם הטופו כבר מכיל יותר שומן.'},{time:'19:30–20:00',name:'ארוחת ערב',goal:'סגירת חלבון יומי וארוחה גמישה שמתאימה לחיים',kcal:500,p:42,c:36,f:20,foods:[['אפשרות מועדפת','2 ביצים + קופסת טונה מסוננת'],['פחמימה','2 פרוסות לחם, 70–80 גרם, או 140 גרם בטטה מבושלת'],['ירקות','200–250 גרם לפי סבילות'],['שומן','50 גרם אבוקדו או 15 גרם טחינה']],swaps:['גרסה צמחית: 220 גרם טופו מוקפץ קלות','גבינה צהובה: 50 גרם במקום חלק מהחלבון, מדי פעם','אם אוכלים מאוחר: לשמור על אותה כמות ולבחור הכנה קלה לעיכול'],prep:'אפשר לאכול גם בשעה 20:00. המערכת תזיז את השעה לפי היום ולא תסמן את הארוחה כחריגה.'}];
function renderMeals(w,d){const key='ozbody-mealdone-'+new Date().toISOString().slice(0,10);let done=JSON.parse(localStorage.getItem(key)||'[]');const root=d.getElementById('detailedPlan');root.innerHTML=meals.map((m,i)=>`<div class="meal-card ${done.includes(i)?'completed':''}" data-i="${i}"><div class="meal-head"><div><h3>${m.name}</h3><span class="small">${m.time} · ${m.goal}</span></div><span>${done.includes(i)?'✅':'⌄'}</span></div><div class="meal-body"><div class="macro"><div><b>${m.kcal}</b><br>קלוריות</div><div><b>${m.p}g</b><br>חלבון</div><div><b>${m.c}g</b><br>פחמימה</div><div><b>${m.f}g</b><br>שומן</div></div><h4>מה לשים בצלחת</h4>${m.foods.map(x=>`<div class="foodrow"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}<h4>תחליפים מדויקים</h4><div>${m.swaps.map(x=>`<span class="tag">${x}</span>`).join('')}</div><h4>איך להכין</h4><p>${m.prep}</p><div class="action-grid"><button class="done" data-done="${i}">${done.includes(i)?'בוצע ✓':'סיימתי'}</button><button class="swap" data-swap="${i}">החלפה</button><button class="ask" data-ask="${i}">שאל אותי</button></div></div></div>`).join('');root.querySelectorAll('.meal-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));root.querySelectorAll('[data-done]').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.done;done=done.includes(i)?done.filter(x=>x!==i):[...done,i];localStorage.setItem(key,JSON.stringify(done));renderMeals(w,d);const s=d.getElementById('mealScore');if(s)s.textContent=done.length+'/4'});root.querySelectorAll('[data-swap]').forEach(b=>b.onclick=()=>alert(meals[+b.dataset.swap].swaps.join('\n\n')));root.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{d.querySelector('[data-pane="talk"]').click();d.getElementById('nutriInput').value='יש לי שאלה על '+meals[+b.dataset.ask].name+': '});const s=d.getElementById('mealScore');if(s)s.textContent=done.length+'/4';}
function setupActual(d){const pic=d.getElementById('mealPhoto');pic.onchange=e=>{const f=e.target.files[0];if(!f)return;const img=d.getElementById('mealPreview');img.src=URL.createObjectURL(f);img.hidden=false};const key='ozbody-actual-'+new Date().toISOString().slice(0,10);let logs=JSON.parse(localStorage.getItem(key)||'[]');const render=()=>{d.getElementById('actualLog').innerHTML=logs.length?logs.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${x.type} · ${x.time}</b><div>${x.text}</div><span class="small">${x.amount||''}</span></div>`).join(''):'<p class="small">עדיין לא נוספו ארוחות.</p>'};render();d.getElementById('saveActual').onclick=()=>{const text=d.getElementById('actualText').value.trim();if(!text)return alert('רשום מה אכלת');logs.push({type:d.getElementById('actualType').value,time:d.getElementById('actualTime').value||new Date().toTimeString().slice(0,5),text,amount:d.getElementById('actualAmount').value});localStorage.setItem(key,JSON.stringify(logs));d.getElementById('actualText').value='';d.getElementById('actualAmount').value='';render()}}
function setupChat(d){const key='ozbody-nutrichat';let chat=JSON.parse(localStorage.getItem(key)||'[]');if(!chat.length)chat=[{who:'bot',text:'עוז, אפשר לשאול אותי על כמויות, תחליפים, ארוחה לפני או אחרי אימון, או מה לעשות אם אכלת משהו אחר.'}];const render=()=>{const box=d.getElementById('nutriChat');box.innerHTML=chat.map(x=>`<div class="bubble ${x.who==='me'?'mine':'theirs'}">${x.text}</div>`).join('');box.scrollTop=box.scrollHeight};const answer=q=>{if(/טונה/.test(q))return 'במקום קופסת טונה אפשר לבחור 180 גרם טופו קשה, 150–180 גרם עוף מבושל, או 2 ביצים ועוד 150 גרם חלבוני ביצה. הבחירה תלויה בארוחה ובכמות החלבון שכבר אכלת.';if(/צמח|טופו|טמפה|עדשים|קטניות/.test(q))return 'אפשר לשלב חלבון מהצומח: 220–250 גרם טופו קשה, 150 גרם אדממה, או שילוב עדין של קטניות לפי סבילות מערכת העיכול. בגלל הקרוהן נעקוב אחרי התגובה ולא נעלה סיבים בבת אחת.';if(/מאוחר|שמונה|20/.test(q))return 'אפשר לאכול גם ב-20:00. אשמור את הארוחה מסודרת, עם חלבון מלא וכמות פחמימה שתואמת את האימון והיום, במקום לדרוש שעה קשיחה.';if(/תמונה|צלחת/.test(q))return 'אפשר להעלות תמונה במסך "מה אכלתי". כרגע היא תישמר לתיעוד; ניתוח אמיתי של כמויות וקלוריות יפעל לאחר חיבור מנוע ה-AI בצד השרת.';return 'קיבלתי. בגרסה הנוכחית אני נותן תשובות בסיסיות מתוך התוכנית שלך. בחיבור ה-AI המלא אוכל לחשב מחדש את הארוחה ואת המשך היום לפי מה שתכתוב או תעלה.'};render();d.getElementById('nutriSend').onclick=()=>{const inp=d.getElementById('nutriInput'),q=inp.value.trim();if(!q)return;chat.push({who:'me',text:q},{who:'bot',text:answer(q)});localStorage.setItem(key,JSON.stringify(chat));inp.value='';render()};['chatPic','chatVoice','chatVid'].forEach(id=>d.getElementById(id).onchange=e=>{const f=e.target.files[0];if(!f)return;chat.push({who:'me',text:'צירפתי '+f.name},{who:'bot',text:'הקובץ נקלט בממשק. ניתוח התוכן עצמו יפעל לאחר חיבור מנוע ה-AI המאובטח.'});localStorage.setItem(key,JSON.stringify(chat));render()})}
</script></body></html>
