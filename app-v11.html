<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OZ Body V11</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6;font-family:Arial,sans-serif}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="app-v10.html?v=11"></iframe><script>const outer=document.getElementById('app');outer.addEventListener('load',()=>watchOuter());function watchOuter(){const od=outer.contentDocument;if(!od)return;const patch=()=>{const inner=od.getElementById('app');if(inner&&inner.contentDocument)patchFood(inner.contentDocument)};patch();new MutationObserver(patch).observe(od.body,{childList:true,subtree:true});const inner=od.getElementById('app');if(inner)inner.addEventListener('load',patch)}function patchFood(d){const box=d.querySelector('.upload');if(box&&!box.dataset.dualPicker){box.dataset.dualPicker='1';const old=d.getElementById('foodPic');if(old)old.closest('label')?.remove();const controls=d.createElement('div');controls.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px';controls.innerHTML='<label style="display:block;cursor:pointer;background:#111827;color:#fff;padding:13px;border-radius:12px;font-weight:800">📷 לצלם עכשיו<input id="foodCamera" type="file" accept="image/*" capture="environment" hidden></label><label style="display:block;cursor:pointer;background:#eef2ff;padding:13px;border-radius:12px;font-weight:800">🖼️ לבחור מהגלריה<input id="foodGallery" type="file" accept="image/*" hidden></label>';box.prepend(controls);const prev=d.getElementById('foodPrev');const show=e=>{const f=e.target.files&&e.target.files[0];if(f&&prev){prev.src=URL.createObjectURL(f);prev.hidden=false}};d.getElementById('foodCamera').onchange=show;d.getElementById('foodGallery').onchange=show}['chatImg'].forEach(id=>{const old=d.getElementById(id);if(old&&!old.dataset.fixed){old.dataset.fixed='1';old.removeAttribute('capture');const label=old.closest('label');if(label)label.firstChild.textContent='🖼️ גלריה '}});const chatRow=d.querySelector('#p3 .card div[style*="grid-template-columns"]');if(chatRow&&!d.getElementById('chatCamera')){const lab=d.createElement('label');lab.className='tiny';lab.style.textAlign='center';lab.innerHTML='📷 מצלמה<input id="chatCamera" type="file" accept="image/*" capture="environment" hidden>';chatRow.prepend(lab);chatRow.style.gridTemplateColumns='repeat(4,1fr)';d.getElementById('chatCamera').onchange=()=>{const chat=d.getElementById('chat');if(chat)chat.insertAdjacentHTML('beforeend','<div class="bubble me">📷 צורפה תמונה מהמצלמה</div>')}}}setInterval(()=>{try{watchOuter()}catch(e){}},1500);</script></body></html>
