name: Deploy MYBH Flow PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-oz-body-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MYBH Flow
        uses: actions/checkout@v4
        with:
          ref: oz-body-app

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload MYBH Flow artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: oz-body

      - name: Deploy MYBH Flow
        id: deployment
        uses: actions/deploy-pages@v4

