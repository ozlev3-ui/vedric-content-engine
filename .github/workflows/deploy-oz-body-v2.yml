name: Deploy OZ Body PWA v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-oz-body-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OZ Body branch
        uses: actions/checkout@v4
        with:
          ref: oz-body-app
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload OZ Body
        uses: actions/upload-pages-artifact@v3
        with:
          path: oz-body
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
