name: Deploy OZ Body PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-oz-body-v2.yml'
      - 'index.html'
      - 'app-v*.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full OZ Body app
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload full OZ Body artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy OZ Body
        id: deployment
        uses: actions/deploy-pages@v4

