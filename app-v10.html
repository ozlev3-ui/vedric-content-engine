<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OZ Body V10</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6;font-family:Arial,sans-serif}iframe{border:0;width:100%;height:100%;display:block}.nutri-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.nutri-tabs button{border:0;border-radius:12px;padding:10px 4px;background:#eef2ff;font-weight:700}.nutri-tabs button.active{background:#111827;color:#fff}.nutri-pane{display:none}.nutri-pane.active{display:block}.meal-card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;margin-bottom:12px;overflow:hidden}.meal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;cursor:pointer}.meal-body{display:none;padding:0 14px 14px;border-top:1px solid #eee}.meal-card.open .meal-body{display:block}.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.macro div{background:#f3f4f6;border-radius:10px;padding:8px;text-align:center;font-size:12px}.foodrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.foodrow:last-child{border:0}.tag{display:inline-block;background:#eef2ff;border-radius:99px;padding:5px 9px;font-size:12px;margin:3px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px;font-weight:800}.chatbox{height:320px;overflow:auto;background:#f8fafc;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:85%;padding:10px 12px;border-radius:15px;line-height:1.45}.me{align-self:flex-start;background:#d9f99d}.bot{align-self:flex-end;background:#fff;border:1px solid #e5e7eb}.chatinput{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}.upload{border:2px dashed #cbd5e1;border-radius:16px;padding:18px;text-align:center;background:#f8fafc}.preview{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-top:10px}.hint{background:#fff7ed;border-radius:14px;padding:12px;margin-bottom:12px}.small{font-size:12px;color:#6b7280}</style></head><body><iframe id="app" src="app-v6.html?v=10"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;install(w,d);new w.MutationObserver(()=>install(w,d)).observe(d.body,{childList:true,subtree:true});});function install(w,d){const sec=d.getElementById('food');if(!sec||sec.dataset.v10)return;sec.dataset.v10='1';sec.innerHTML=`<div class="hint"><b>המאמן התזונתי שלך</b><br><span class="small">מותאם להעדפות שלך: גבינה צהובה אפשרית, ללא גבינות לבנות, שילוב ביצים וטונה וגם חלבון מהצומח.</span></div><div class="nutri-tabs"><button class="active" data-pane="p1">התוכנית</button><button data-pane="p2">מה אכלתי</button><button data-pane="p3">דבר איתי</button><button data-pane="p4">סיכום</button></div><div id="p1" class="nutri-pane active"><div id="mealCards"></div></div><div id="p2" class="nutri-pane"><div class="card"><h2>צילום ארוחה</h2><div class="upload"><label style="display:block;cursor:pointer">📷 צילום או העלאת תמונה<input id="foodPic" type="file" accept="image/*" capture="environment" hidden></label><img id="foodPrev" class="preview" hidden><p class="small">אפשר להעלות תמונה, לרשום מה אכלת ולשמור ליומן.</p></div><label>סוג ארוחה<select id="actualType"><option>ארוחת בוקר</option><option>ארוחת ביניים</option><option>ארוחת צהריים</option><option>אחרי אימון</option><option>ארוחת ערב</option><option>נשנוש</option><option>אחר</option></select></label><label>מה היה בצלחת<textarea id="actualText" rows="3"></textarea></label><label>כמות משוערת<input id="actualAmount" placeholder="למשל 450 גרם"></label><button class="primary" id="saveActual">שמירה ביומן</button></div><div class="card"><h3>יומן היום</h3><div id="actualLog"></div></div></div><div id="p3" class="nutri-pane"><div class="card"><h2>התזונאי האישי</h2><div id="chat" class="chatbox"></div><div class="chatinput"><textarea id="chatInput" rows="2" placeholder="למשל: אין לי טונה, במה להחליף?"></textarea><button class="primary" style="width:auto" id="sendChat">שלח</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><label class="tiny" style="text-align:center">📷 תמונה<input id="chatImg" type="file" accept="image/*" hidden></label><label class="tiny" style="text-align:center">🎙️ קול<input id="chatAud" type="file" accept="audio/*" capture hidden></label><label class="tiny" style="text-align:center">🎥 וידאו<input id="chatVid" type="file" accept="video/*" capture hidden></label></div></div></div><div id="p4" class="nutri-pane"><div class="card"><h2>סיכום יומי</h2><p><b id="doneCount">0 מתוך 4 ארוחות סומנו</b></p><p>חלבון מתוכנן: כ-150 גרם</p><p>המערכת תעדכן בהמשך את היעדים לפי ההתקדמות בפועל.</p></div></div>`;setupTabs(d);renderMeals(d);setupActual(d);setupChat(d);}function setupTabs(d){d.querySelectorAll('.nutri-tabs button').forEach(b=>b.onclick=()=>{d.querySelectorAll('.nutri-tabs button').forEach(x=>x.classList.remove('active'));d.querySelectorAll('.nutri-pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');d.getElementById(b.dataset.pane).classList.add('active')})}const meals=[{time:'10:00',name:'ארוחת בוקר',goal:'שובע וחלבון גבוה',k:520,p:48,c:39,f:18,foods:[['ביצים','2 ביצים שלמות'],['טונה','קופסה אחת מסוננת, 112–140 גרם'],['לחם','2 פרוסות, 70–80 גרם'],['ירקות','עגבנייה 120 גרם + מלפפון 150 גרם'],['טחינה','15 גרם טחינה גולמית']],swaps:['180 גרם טופו קשה במקום הטונה','200 גרם תפוח אדמה מבושל במקום הלחם','40–50 גרם גבינה צהובה כאפשרות מדי פעם'],prep:'לסנן את הטונה, לשקול את הלחם והטחינה, ולהכין סלט קצוץ.'},{time:'13:30',name:'ארוחת ביניים',goal:'שמירה על אנרגיה',k:260,p:22,c:30,f:7,foods:[['אפשרות א׳','בננה 120 גרם + 25 גרם אבקת חלבון במים'],['אפשרות ב׳','150 גרם אדממה מבושלת ומקולפת'],['אפשרות ג׳','70 גרם לחם + 80 גרם טונה מסוננת']],swaps:['150 גרם תפוח קלוף במקום בננה','180 גרם טופו במקום אבקת חלבון'],prep:'לבחור אפשרות אחת בלבד.'},{time:'15:00',name:'אחרי אימון',goal:'התאוששות ושמירת מסת שריר',k:650,p:50,c:72,f:16,foods:[['חלבון','200 גרם עוף/הודו/דג אחרי בישול'],['פחמימה','150 גרם אורז מבושל או 270 גרם תפוח אדמה'],['ירקות','200–250 גרם ירקות מבושלים'],['שמן זית','5 גרם']],swaps:['250 גרם טופו + 100 גרם אדממה','2 ביצים + קופסת טונה','180 גרם קינואה מבושלת במקום אורז'],prep:'כל המשקלים בארוחה זו הם אחרי בישול.'},{time:'19:30–20:00',name:'ארוחת ערב',goal:'סגירת חלבון יומי',k:500,p:42,c:36,f:20,foods:[['אפשרות מועדפת','2 ביצים + קופסת טונה מסוננת'],['פחמימה','70–80 גרם לחם או 140 גרם בטטה'],['ירקות','200–250 גרם'],['שומן','50 גרם אבוקדו או 15 גרם טחינה']],swaps:['220 גרם טופו מוקפץ','50 גרם גבינה צהובה + ביצה אחת'],prep:'לבחור פחמימה אחת ושומן אחד.'}];function renderMeals(d){const box=d.getElementById('mealCards');box.innerHTML=meals.map((m,i)=>`<div class="meal-card"><div class="meal-head"><div><h3 style="margin:0 0 4px">${m.name}</h3><div class="small">${m.time} · ${m.goal}</div></div><b>פתח פירוט ⌄</b></div><div class="meal-body"><div class="macro"><div>${m.k}<br>קלוריות</div><div>${m.p}g<br>חלבון</div><div>${m.c}g<br>פחמימה</div><div>${m.f}g<br>שומן</div></div><h4>מה לאכול</h4>${m.foods.map(x=>`<div class="foodrow"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}<h4>תחליפים</h4>${m.swaps.map(x=>`<span class="tag">${x}</span>`).join('')}<h4>הכנה</h4><p>${m.prep}</p><div class="actions"><button class="doneBtn" data-i="${i}" style="background:#dcfce7">✓ סיימתי</button><button class="swapBtn" data-i="${i}" style="background:#eef2ff">↔ תחליף</button><button class="askBtn" data-i="${i}" style="background:#111827;color:#fff">💬 שאל</button></div></div></div>`).join('');box.querySelectorAll('.meal-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));box.querySelectorAll('.doneBtn').forEach(b=>b.onclick=()=>{b.dataset.done=b.dataset.done==='1'?'0':'1';b.textContent=b.dataset.done==='1'?'✓ בוצע':'✓ סיימתי';updateDone(d)});box.querySelectorAll('.askBtn').forEach(b=>b.onclick=()=>{d.querySelector('[data-pane="p3"]').click();d.getElementById('chatInput').value='יש לי שאלה על '+meals[b.dataset.i].name+': '});box.querySelectorAll('.swapBtn').forEach(b=>b.onclick=()=>alert(meals[b.dataset.i].swaps.join('\n')))}function updateDone(d){const n=[...d.querySelectorAll('.doneBtn')].filter(x=>x.dataset.done==='1').length;d.getElementById('doneCount').textContent=n+' מתוך 4 ארוחות סומנו'}function setupActual(d){const pic=d.getElementById('foodPic'),prev=d.getElementById('foodPrev');pic.onchange=e=>{const f=e.target.files[0];if(f){prev.src=URL.createObjectURL(f);prev.hidden=false}};const key='ozbody-actual-'+new Date().toISOString().slice(0,10);let logs=JSON.parse(localStorage.getItem(key)||'[]');const render=()=>d.getElementById('actualLog').innerHTML=logs.length?logs.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${x.type}</b><div>${x.text}</div><small>${x.amount||''}</small></div>`).join(''):'<p class="small">עדיין לא נשמרה ארוחה.</p>';render();d.getElementById('saveActual').onclick=()=>{const text=d.getElementById('actualText').value.trim();if(!text)return alert('רשום מה אכלת');logs.push({type:d.getElementById('actualType').value,text,amount:d.getElementById('actualAmount').value});localStorage.setItem(key,JSON.stringify(logs));d.getElementById('actualText').value='';d.getElementById('actualAmount').value='';render()}}function setupChat(d){const chat=d.getElementById('chat');const add=(t,c)=>{const x=d.createElement('div');x.className='bubble '+c;x.textContent=t;chat.appendChild(x);chat.scrollTop=chat.scrollHeight};add('היי עוז, אפשר לשאול אותי על כל ארוחה, תחליפים, כמויות, מסעדות או מה לעשות אם אכלת משהו אחר.','bot');d.getElementById('sendChat').onclick=()=>{const i=d.getElementById('chatInput'),q=i.value.trim();if(!q)return;add(q,'me');i.value='';let a='כרגע זה ממשק עובד, אך תשובת AI מלאה תחובר בשלב הבא.';if(q.includes('טונה'))a='במקום קופסת טונה אפשר לבחור 180 גרם טופו קשה, או 150–180 גרם עוף מבושל, בהתאם לארוחה.';else if(q.includes('ביצה'))a='במקום 2 ביצים אפשר לבחור 180 גרם טופו, או לשלב ביצה אחת עם 80 גרם טונה.';else if(q.includes('מסעדה'))a='צלם את המנה או כתוב מה יש בתפריט, ואז נבנה בחירה עם חלבון, פחמימה וירקות.';setTimeout(()=>add(a,'bot'),300)};['chatImg','chatAud','chatVid'].forEach(id=>d.getElementById(id).onchange=e=>{if(e.target.files[0])add('צורף קובץ: '+e.target.files[0].name,'me')})}</script></body></html>
